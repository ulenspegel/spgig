<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Event</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
	<main class="container">
		<h1>Event</h1>

		<form id="eventForm">
			<!-- ================================================== -->
			<!-- General information                                -->
			<!-- ================================================== -->
			<section class="section">
				<h2>General information</h2>

				<label>
					Date
					<input type="date" id="date" required>
				</label>


				<label>
					Organizer contact
					<input type="text" id="organizer" required>
				</label>

				<label>
					Number of bands
					<input type="number" id="bandCount" min="1" max="6" value="1" required>
				</label>
			</section>

			<!-- ================================================== -->
			<!-- Bands                                              -->
			<!-- ================================================== -->
			<section class="section">
				<h2>Bands</h2>
				<div id="bands"></div>
			</section>

			<!-- ================================================== -->
			<!-- Performance order                                  -->
			<!-- ================================================== -->
			<section class="section">
				<h2>Performance order</h2>
				<p class="hint">Drag the bands into the desired order.</p>

				<div class="changeover">
					<span>Change-over, min</span>
					<div class="stepper">
						<button type="button" id="changeoverMinus" aria-label="Decrease">−</button>
						<span id="changeoverValue">20</span>
						<button type="button" id="changeoverPlus" aria-label="Increase">+</button>
					</div>
				</div>

				<div id="orderList"></div>
			</section>

			<!-- ================================================== -->
			<!-- Soundcheck                                         -->
			<!-- ================================================== -->
			<section class="section">
				<h2>Soundcheck</h2>
				<p class="hint">The band performing first always checks sound last.</p>
				<div id="soundcheckList"></div>
			</section>

			<button type="submit" id="saveButton">
				Save
			</button>
		</form>

		<!-- ====================================================== -->
		<!-- Result                                                 -->
		<!-- ====================================================== -->
		<section id="result" class="section hidden">
			<h2>Result text</h2>

			<textarea id="resultText" readonly></textarea>

			<button type="button" id="copyButton">
				Copy
			</button>
		</section>

		<div id="status"></div>
	</main>

	<script src="config.js"></script>
	<script src="app.js"></script>
</body>
</html>
